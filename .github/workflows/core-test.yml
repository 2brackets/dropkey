name: Core Tests

on:
  push:
    paths:
      - 'core/**'
      - '.github/workflows/core-test.yml'
  pull_request:
    paths:
      - 'core/**'
      - '.github/workflows/core-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: core

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: core/pom.xml

      - name: Run unit tests
        run: mvn --batch-mode clean test