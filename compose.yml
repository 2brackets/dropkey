services:
  mysql:
    image: mysql:8.4
    container_name: dropkey-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: dropkey
      MYSQL_USER: dropkey
      MYSQL_PASSWORD: dropkey
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - dropkey_mysql_data:/var/lib/mysql

volumes:
  dropkey_mysql_data: